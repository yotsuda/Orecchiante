name: Release

# Tag-driven release, after Calamo's and Lily#'s release.yml: pushing a tag like v0.18.0 checks the tag against the
# version and the Marketplace token, then for each system (win32-x64 on Windows; darwin-arm64 and darwin-x64 on a Mac,
# where the reader is signed as it is built) fetches the models, runs the tests (on the two systems the runners are:
# Windows x64 and Apple silicon) and packs the extension (tools/pack-extension.ps1: the reader published self-contained,
# the models beside it, the licenses, the version check, `vsce package --target`); then attaches the three .vsix to a
# GitHub Release and publishes them to the VS Code Marketplace, one after another.
#
# Run by hand (workflow_dispatch) with publish_targets empty, it only packs and keeps the .vsix as workflow artifacts:
# no Release, no Marketplace. Do that once before a tag that changes how the packages are made, so that the runners are
# proven before a version is spent -- THE MARKETPLACE NEVER ACCEPTS A VERSION TWICE.
# Run by hand with publish_targets (win32-x64, darwin-arm64, darwin-x64, comma-separated), it publishes those targets of
# the current version from its GitHub Release instead: the way to finish a release the Marketplace did not list.
#
# The models are not in the repository (2026-11-26, the owner agreeing: git keeps every version of a large
# file for good, and GitHub refuses a file over 100 MB): onnx/models.json lists them, each an asset of the
# GitHub Release `models-1` (or a later one) with its SHA-256, and tools/fetch-models.ps1 fetches them
# before the pack. README says how each is made.
#
# Secret: VSCE_PAT, the same Marketplace -> Manage token as Lily#'s and Calamo's (the Microsoft account
# that OWNS the publisher `yotsuda`; Calamo's release.yml says how it is made). It expires 2027-10-16:
# when a release fails at verify-pat, renew it and update the secret in all three repositories.
#
# Only a tag pushed by the owner or a run by hand starts this workflow, so the secret never reaches a
# fork's pull request. Lily#'s menu runs the reader: a Lily# with the menu (after its v0.16.0) has to
# be on the Marketplace for an Orecchiante there to be of use.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_targets:
        description: 'Finish a release: targets to publish from the GitHub Release (win32-x64, darwin-arm64, darwin-x64). Empty: pack only.'
        required: false
        default: ''

permissions:
  contents: write   # create the GitHub Release + upload the .vsix

jobs:
  check:
    if: github.event.inputs.publish_targets == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag matches the version
        # v0.18.0 must be extension/package.json's 0.18.0 (pack-extension.ps1 then checks that the
        # reader's own `--version` says the same: Program.cs). The version is not rewritten from the tag.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $pkg = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "tag $env:GITHUB_REF_NAME, extension/package.json $pkg : make them one before tagging" }
          "version $pkg"

      - name: Publish rights
        # One request before the build: a wrong or expired PAT fails here, not after the packs.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $publisher = (Get-Content extension/package.json -Raw | ConvertFrom-Json).publisher
          npx --yes @vscode/vsce verify-pat $publisher
          if ($LASTEXITCODE -ne 0) { throw "verify-pat failed for '$publisher': nothing was published" }

  vsix:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   target: win32-x64,    test: true }
          - { os: macos-latest,   rid: osx-arm64, target: darwin-arm64, test: true }
          - { os: macos-latest,   rid: osx-x64,   target: darwin-x64,   test: false }   # (packed on Apple silicon; the tests run on arm64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rosetta
        # the Intel reader says its --version --json in the pack (pack-extension.ps1): on Apple silicon, through Rosetta
        if: matrix.rid == 'osx-x64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - name: Models
        # onnx/models.json's, from their Release, checked by SHA-256.
        shell: pwsh
        run: ./tools/fetch-models.ps1

      - name: Test
        # ci.yml's tests (tests/Orecchiante.Tests, a recording read end to end with these models) before anything is
        # packed or published: a version that fails them is never spent on the Marketplace.
        if: matrix.test
        run: dotnet test tests/Orecchiante.Tests -c Release --logger "console;verbosity=normal"

      - name: Pack
        # The same script the local deploy uses (the models from onnx/).
        shell: pwsh
        run: ./tools/pack-extension.ps1 -Rid ${{ matrix.rid }} -Out "$PWD/out/extension"

      - name: Keep the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: orecchiante-${{ matrix.target }}
          path: out/extension/*.vsix
          if-no-files-found: error

  publish:
    needs: vsix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The packages
        uses: actions/download-artifact@v4
        with:
          pattern: orecchiante-*
          path: vsix
          merge-multiple: true

      - name: Extract release notes
        # The topmost section of extension/CHANGELOG.md is the version being tagged (the Marketplace
        # shows the same file on its Changelog tab). The heading is dropped: the Release has the tag.
        shell: pwsh
        run: |
          $n = 0
          $notes = foreach ($line in Get-Content extension/CHANGELOG.md) {
            if ($line -match '^## ') { $n++; continue }
            if ($n -eq 1) { $line }
          }
          Set-Content RELEASE_NOTES.md ($notes -join "`n")
          Get-Content RELEASE_NOTES.md
          Get-ChildItem vsix

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: vsix/*.vsix

      - name: Publish to VS Code Marketplace
        # The packed .vsix as they are (each one's target is inside it), Windows first, no --pre-release ("preview":
        # true in package.json is the Preview label, a different thing). The script waits for each listing.
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $files = 'win32-x64', 'darwin-arm64', 'darwin-x64' | ForEach-Object { (Get-ChildItem "vsix/orecchiante-$_-*.vsix").FullName }
          ./tools/publish-marketplace.ps1 -Vsix $files

  finish:
    # By hand, with publish_targets: the very files the GitHub Release holds.
    if: github.event.inputs.publish_targets != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish rights
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $publisher = (Get-Content extension/package.json -Raw | ConvertFrom-Json).publisher
          npx --yes @vscode/vsce verify-pat $publisher
          if ($LASTEXITCODE -ne 0) { throw "verify-pat failed for '$publisher': nothing was published" }

      - name: Publish the targets from the Release
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TARGETS: ${{ github.event.inputs.publish_targets }}
        run: |
          $version = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          $files = foreach ($target in $env:PUBLISH_TARGETS -split '[,\s]+' | Where-Object { $_ }) {
            $name = "orecchiante-$target-$version.vsix"
            gh release download "v$version" --pattern $name --dir release-vsix
            if ($LASTEXITCODE -ne 0) { throw "no $name in the release v$version" }
            "release-vsix/$name"
          }
          ./tools/publish-marketplace.ps1 -Vsix $files
